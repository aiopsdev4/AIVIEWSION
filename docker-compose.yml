services:
  devcontainer:
    container_name: frigate-devcontainer
    group_add:
      - "109" # render
      - "110" # render
      - "44"  # video
      - "46"  # plugdev
    shm_size: "1gb"
    restart: always
    build:
      context: .
      dockerfile: docker/tensorrt/Dockerfile.amd64
      target: frigate
    ports:
      - "5000:5000" # Access your custom Frigate at http://localhost:5000
      - "18554:8554" # RTSP Feeds
      - "18555:8555" # WebRTC
    environment:
      YOLO_MODELS: ""
    volumes:
      # 1. YOUR REAL DATA (Kept in local_data so Git ignores it)
      - ./local_data/config.yml:/config/config.yml
      - ./local_data/frigate.db:/config/frigate.db
      - ./local_data/storage:/media/frigate
      - ./local_data/yolov8n.onnx:/config/yolov8n.onnx
      - ./local_data/labels.txt:/config/labels.txt
      
      # 2. THE CUSTOM CODE (This injects your changes into the container)
      - ./frigate:/opt/frigate/frigate:cached
      - ./migrations:/opt/frigate/migrations:cached
      - ./web/dist:/opt/frigate/web:cached
      - /etc/localtime:/etc/localtime:ro
      
      # CRITICAL: I removed the duplicate ./config and ./debug lines 
      # which were pointing to the same place as your local_data.
    
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tmpfs:
      - /tmp/cache
  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2.0
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
